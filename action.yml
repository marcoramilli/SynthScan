name: "SynthScan"
description: "Detect AI-generated / synthetic code patterns and open a GitHub Issue with the findings."
author: "Marco Ramilli"

branding:
  icon: "search"
  color: "orange"

inputs:
  scan_path:
    description: "Path to the directory to scan (relative to repo root)."
    required: false
    default: "."
  patterns_file:
    description: "Path to the Markdown file containing detection patterns."
    required: false
    default: "patterns/synthetic_patterns.md"
  score_threshold:
    description: "Fail the action when the Synthetic Code Score (per 1k LOC) meets or exceeds this value. Set to 0 to never fail."
    required: false
    default: "0"
  create_issue:
    description: "Whether to create a GitHub Issue with the results (true/false)."
    required: false
    default: "true"
  issue_label:
    description: "Label to attach to the created issue."
    required: false
    default: "synthscan"
  report_path:
    description: "File path for the JSON report."
    required: false
    default: "synthscan-report.json"
  diff_file:
    description: "Path to a unified diff file. When set, only added lines in the diff are scored (PR mode)."
    required: false
    default: ""
  sarif_output:
    description: "Emit a SARIF 2.1.0 report for GitHub Code Scanning inline annotations (true/false)."
    required: false
    default: "false"
  ignore_file:
    description: "Path to a .synthscanignore file with gitignore-style path patterns to exclude."
    required: false
    default: ".synthscanignore"

outputs:
  score:
    description: "The Synthetic Code Score (normalised per 1k LOC)."
    value: ${{ steps.scan.outputs.score }}
  raw_score:
    description: "The raw (un-normalised) total score."
    value: ${{ steps.scan.outputs.raw_score }}
  match_count:
    description: "Number of pattern matches found."
    value: ${{ steps.scan.outputs.match_count }}
  lines_scanned:
    description: "Total lines of code scanned."
    value: ${{ steps.scan.outputs.lines_scanned }}
  issue_body:
    description: "Full Markdown body of the report (also used in the issue)."
    value: ${{ steps.scan.outputs.issue_body }}
  high_critical_hit_rate:
    description: "Number of HIGH or CRITICAL matches per file scanned."
    value: ${{ steps.scan.outputs.high_critical_hit_rate }}
  risk_score:
    description: "Uncalibrated SynthScan risk index (0-100)."
    value: ${{ steps.scan.outputs.risk_score }}
  risk_severity:
    description: "Heuristic risk band (LOW, MEDIUM, HIGH, CRITICAL)."
    value: ${{ steps.scan.outputs.risk_severity }}
  risk_vectors:
    description: "JSON object containing the four uncalibrated risk vector scores."
    value: ${{ steps.scan.outputs.risk_vectors }}
  by_directory:
    description: "JSON object mapping directory paths to their score."
    value: ${{ steps.scan.outputs.by_directory }}
  sarif_path:
    description: "Path of the emitted SARIF report (only set when sarif_output is true)."
    value: ${{ steps.scan.outputs.sarif_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run SynthScan
      id: scan
      shell: bash
      env:
        INPUT_SCAN_PATH: ${{ inputs.scan_path }}
        INPUT_PATTERNS_FILE: ${{ inputs.patterns_file }}
        INPUT_SCORE_THRESHOLD: ${{ inputs.score_threshold }}
        INPUT_REPORT_PATH: ${{ inputs.report_path }}
        INPUT_DIFF_FILE: ${{ inputs.diff_file }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif_output }}
        INPUT_IGNORE_FILE: ${{ inputs.ignore_file }}
      run: |
        python "${{ github.action_path }}/scanner/synthscan.py"

    - name: Create GitHub Issue
      if: inputs.create_issue == 'true' && steps.scan.outputs.match_count != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const score = `${{ steps.scan.outputs.score }}`;
          const body  = `${{ steps.scan.outputs.issue_body }}`.replace(/\\n/g, '\n');

          // Check for existing open issue to avoid duplicates
          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: '${{ inputs.issue_label }}',
            state: 'open',
          });

          if (existing.data.length > 0) {
            // Update the most recent open issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.data[0].number,
              body: body,
            });
            core.info(`Updated existing issue #${existing.data[0].number}`);
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `SynthScan Report – Synthetic Score: ${score}`,
              body: body,
              labels: ['${{ inputs.issue_label }}'],
            });
            core.info('Created new SynthScan issue');
          }

    - name: Upload JSON report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: synthscan-report
        path: ${{ inputs.report_path }}

    - name: Upload SARIF report
      if: inputs.sarif_output == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}
        category: synthscan
